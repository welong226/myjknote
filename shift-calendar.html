<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的班表</title>
<style>
  :root {
    --bg: #eef1f6;
    --card: #ffffff;
    --accent: #f5c518;
    --today: #e53935;
    --muted: #9aa3b2;
    --muted-bg: #e8eef7;
    --grid: #d9e0ec;
    --text: #2b2f38;
    --header-h: 52px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    max-width: 560px; margin: 0 auto; min-height: 100vh; width: 100%;
    background: var(--bg); display: flex; flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,.08);
  }
  /* 大螢幕（桌機/平板）才限寬並置中，手機/小螢幕直接滿版 */
  @media (min-width: 600px) {
    .phone { max-width: 480px; }
  }
  .status-bar {
    height: 28px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; font-size: 13px; font-weight: 600; color: var(--text); background: var(--card);
  }
  .status-bar .icons { display: flex; gap: 5px; align-items: center; }
  .status-bar svg { display: block; }
  .app-header {
    height: var(--header-h); display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; background: var(--card); border-bottom: 1px solid #eef1f6;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: #2b2f38; font-weight: 800; font-size: 9px; line-height: 1;
    position: relative; overflow: hidden;
  }
  .brand .logo .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#00000022 1px, transparent 1px),
      linear-gradient(90deg, #00000022 1px, transparent 1px);
    background-size: 8px 8px;
  }
  .brand .logo span { position: relative; z-index: 1; letter-spacing: .5px; }
  .brand .title { font-size: 19px; font-weight: 700; }
  .header-actions {
    display: flex; align-items: center; gap: 4px;
  }
  .header-actions button {
    display: flex; align-items: center; gap: 3px;
    border: none; background: none; cursor: pointer;
    color: #5b6472; padding: 6px 7px; border-radius: 8px; font-size: 13px;
    transition: color .15s, background .15s;
  }
  .header-actions button:active { color: var(--accent); }
  .header-actions button.active { color: var(--accent); background: #fff8e1; }
  .header-actions svg { display: block; }
  .month-nav {
    display: flex; align-items: center; justify-content: center; gap: 22px;
    padding: 14px 0 8px; background: var(--card);
  }
  .month-nav .label { font-size: 18px; font-weight: 700; min-width: 120px; text-align: center; }
  .month-nav button {
    width: 34px; height: 34px; border: none; border-radius: 50%;
    background: #f1f3f8; color: #5b6472; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .month-nav button:active { background: #e3e7f0; }
  .calendar {
    background: var(--card); margin: 0 10px 14px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 4px 16px rgba(40,60,90,.06);
  }
  .weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); background: #f7f9fc; border-bottom: 1px solid #eef1f6;
  }
  .weekdays div { text-align: center; padding: 9px 0; font-size: 13px; font-weight: 600; color: #7a8294; }
  .weekdays div.we { color: #c0a23b; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); min-width: 0; }
  .cell {
    height: 78px; display: flex; flex-direction: column; align-items: center;
    position: relative; border-right: 1px solid #f0f3f8; border-bottom: 1px solid #f0f3f8;
    cursor: pointer; background: var(--card); padding: 3px 1px 2px; min-width: 0;
  }
  .cell:nth-child(7n) { border-right: none; }
  .cell .num { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1; }
  /* 班別區：固定高度，有無班別都佔同樣空間 */
  .cell .shift {
    margin-top: 3px; height: 18px; font-size: 17px; padding: 0; width: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-weight: 700; line-height: 1;
    background: transparent; /* 班別不加底色，僅保留文字顏色 */
  }
  .cell .shift.empty { visibility: hidden; }
  /* 記事區：固定兩倍高度（約兩行），允許換行，不撐高格子；空時也佔位 */
  .cell .note {
    margin-top: 2px; height: 30px; width: 96%; max-width: 96%; min-width: 0;
    font-size: 9px; padding: 2px 4px; border-radius: 5px;
    background: transparent; color: #1c6fd6; /* 記事去底色 */
    display: flex; align-items: center; justify-content: center; text-align: center;
    overflow: hidden; white-space: normal; word-break: break-word; line-height: 1.2;
  }
  .cell .note.empty { background: transparent; visibility: hidden; }
  /* 六種班別 */
  .s1, .s2, .s3 { background:#4dabf7; color:#0b4f9e; }  /* 一/二/三 同一種顏色 */
  .s4, .s5      { background:#ffa94d; color:#8a4b00; }  /* 四/五 同一種顏色 */
  .s-off        { background:#8ce99a; color:#2b7a3b; }  /* 休 */
  .chip { display: inline-block; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 6px; font-weight: 700; font-size: 13px; }
  .cell.out { background: var(--muted-bg); }
  .cell.out .num { color: var(--muted); font-weight: 400; }
  .cell.out .shift, .cell.out .note { visibility: hidden; }
  .cell.out::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(#ffffff55 1px, transparent 1px),
      linear-gradient(90deg, #ffffff55 1px, transparent 1px);
    background-size: 10px 10px; pointer-events: none;
  }
  .cell.today .num {
    color: #fff; background: var(--today); width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px;
  }
  .cell.selected { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
  .spacer { flex: 1; }
  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; -webkit-top: 0; -webkit-left: 0; -webkit-right: 0; -webkit-bottom: 0;
    background: rgba(0,0,0,.35); display: none;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 420px; border-radius: 16px 16px 0 0;
    padding: 10px 0 24px; animation: slideUp .22s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: .6;} to { transform: none; opacity: 1;} }
  .sheet .grip { width: 38px; height: 4px; background: #d7dce5; border-radius: 2px; margin: 6px auto 12px; }
  .sheet .sheet-title { text-align: center; font-size: 15px; font-weight: 700; padding: 2px 0 12px; color: #2b2f38; }
  .sheet .row { padding: 14px 20px; font-size: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .sheet .row:active { background: #f3f5f9; }
  .sheet .row .ico { color: #5b6472; }
  .sheet .row .val { margin-left: auto; color: #9aa3b2; font-size: 13px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .stat-card {
    background: var(--card); margin: 0 10px 14px; border-radius: 14px; padding: 16px;
    box-shadow: 0 4px 16px rgba(40,60,90,.06); display: none;
  }
  .stat-card.show { display: block; }
  .stat-card h3 { margin: 0 0 12px; font-size: 16px; }
  .stat-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f0f3f8; font-size: 14px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .v { font-weight: 700; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #323842; color: #fff; padding: 10px 16px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .roster-meta {
    text-align: center; font-size: 13px; color: #7a8294;
    padding: 0 20px 10px; line-height: 1.45;
  }
  .roster-block { padding: 0 16px 4px; max-height: 52vh; overflow-y: auto; }
  .roster-line {
    display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; align-items: flex-start; margin-bottom: 4px;
  }
  .roster-line .lab {
    flex: 0 0 42px; font-weight: 700; padding-top: 1px;
  }
  .roster-line .names {
    flex: 1; color: #2b2f38; line-height: 1.45; word-break: break-word;
  }
  .roster-line.empty .names { color: #b0b7c3; }
  .roster-line.mine { background: #fff8e1; }
  .roster-note {
    margin: 8px 20px 0; padding: 10px 12px; border-radius: 10px;
    background: #f3f6fb; font-size: 13px; color: #1c6fd6; line-height: 1.4;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span id="clock">15:14</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11"><g fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></g></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path fill="currentColor" d="M8 11.2 10.2 8.4a3 3 0 0 0-4.4 0L8 11.2Zm0-5.6a6 6 0 0 0-4.3 1.8L1.2 5.2A9 9 0 0 1 14.8 5.2L12.3 7.4A6 6 0 0 0 8 5.6Zm0-5.6C4.7 0 1.7 1.2 0 3.3l2.5 2.2A9 9 0 0 1 13.5 5.5L16 3.3A12.7 12.7 0 0 0 8 0Z"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3" fill="none" stroke="currentColor"/><rect x="2" y="2" width="16" height="9" rx="1.5" fill="currentColor"/><rect x="23.5" y="4" width="2" height="5" rx="1" fill="currentColor"/></svg>
    </span>
  </div>

  <div class="app-header">
    <div class="brand">
      <div class="logo"><div class="grid"></div><span>SHIFT</span></div>
      <div class="title">我的班表</div>
    </div>
    <div class="header-actions">
      <button id="gotoBtn" title="Goto">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </button>
      <button id="editBtn" title="編輯">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg>
        <span id="editLabel">編輯</span>
      </button>
      <button id="statBtn" title="統計">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="9"/></svg>
      </button>
      <button id="importBtn" title="匯入輪值表">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </div>

  <div class="month-nav">
    <button id="prevBtn">‹</button>
    <div class="label" id="monthLabel">2026年7月</div>
    <button id="nextBtn">›</button>
  </div>

  <div class="stat-card" id="statCard">
    <h3 id="statTitle">本月統計</h3>
    <div id="statBody"></div>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>週一</div><div>週二</div><div>週三</div><div>週四</div><div>週五</div>
      <div class="we">週六</div><div class="we">週日</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="spacer"></div>
</div>

<div class="overlay" id="editOverlay">
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-title" id="editTitle">編輯</div>
    <div class="row" data-act="shift"><span class="ico">🎨</span> 班別<span class="val" id="curShift"></span></div>
    <div class="row" data-act="note"><span class="ico"></span> 記事<span class="val" id="curNote"></span></div>
    <div class="row" data-act="close"><span class="ico">✕</span> 取消</div>
  </div>
</div>

<div class="overlay" id="shiftOverlay">
  <div class="sheet" id="shiftSheet"></div>
</div>

<div class="overlay" id="dayOverlay">
  <div class="sheet" id="daySheet"></div>
</div>

<input type="file" id="fileInput" accept="application/json,.json" style="display:none">
<input type="file" id="rosterInput" accept=".html,.htm,text/html" style="display:none">
<div class="overlay" id="importOverlay">
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-title">匯入輪值表 HTML · OpWeb</div>
    <div class="row" style="cursor:default; flex-direction:column; align-items:stretch; gap:8px;">
      <label style="font-size:13px;color:#5b6472;">主畫面標示人員（格子顯示此人班別）</label>
      <input id="importName" type="text" value="曾威龍"
        style="font-size:16px;padding:10px 12px;border:1px solid #d7dce5;border-radius:10px;">
      <label style="font-size:13px;color:#5b6472;">年月（可留空自動辨識；辨識失敗時填 2026-11）</label>
      <input id="importYm" type="text" placeholder="例如 2026-11 或 115-11"
        style="font-size:16px;padding:10px 12px;border:1px solid #d7dce5;border-radius:10px;">
      <div style="font-size:12px;color:#9aa3b2;line-height:1.4;">
        匯入「平時」全單位班表（本機解析）。格子標示你的班別；點日期可看當天一～五班與休假是誰。代碼：1–5→各班，H→一班、h→二班，/→休假（保留原有記事）。
      </div>
    </div>
    <div class="row" id="pickRosterBtn"><span class="ico">📄</span> 選擇 HTML 檔</div>
    <div class="row" data-act="json"><span class="ico">{}</span> 改匯入 JSON</div>
    <div class="row" data-act="close"><span class="ico">✕</span> 取消</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  // ★ 後端 API 路徑：PHP 部署用 '/api.php'（byethost 等 PHP 主機）；本機 Python 測試才用 '/api/data'
  const API = '/api.php';
  const SHIFT_TYPES = {
    s1:    { label: '一', cls: 's1',    name: '一班' },
    s2:    { label: '二', cls: 's2',    name: '二班' },
    s3:    { label: '三', cls: 's3',    name: '三班' },
    s4:    { label: '四', cls: 's4',    name: '四班' },
    s5:    { label: '五', cls: 's5',    name: '五班' },
    off:   { label: '休', cls: 's-off', name: '休假' }
  };

  let today = new Date();
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let selectedKey = null;
  let editMode = false;
  let data = {};          // 目前已載入的月份資料（可含多月快取）
  let loadedYm = new Set(); // 已從伺服器載入過的月份

  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  const pad = n => String(n).padStart(2,'0');
  const keyOf = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
  const ymOf = (y,m) => `${y}-${pad(m+1)}`;
  const viewYm = () => ymOf(view.getFullYear(), view.getMonth());

  async function loadMonth(ym){
    try {
      const r = await fetch(`${API}?ym=${encodeURIComponent(ym)}`, { cache: 'no-store' });
      if (!r.ok) throw new Error('bad');
      const monthData = await r.json();
      // 清掉該月舊快取再合併
      Object.keys(data).forEach(k => { if (k.startsWith(ym)) delete data[k]; });
      Object.assign(data, monthData || {});
      loadedYm.add(ym);
    } catch(e){
      Object.keys(data).forEach(k => { if (k.startsWith(ym)) delete data[k]; });
      loadedYm.add(ym);
      toast('⚠ 無法連線到伺服器，顯示為空白');
    }
  }
  async function ensureViewMonth(){
    const ym = viewYm();
    if (!loadedYm.has(ym)) await loadMonth(ym);
  }
  async function save(){
    const ym = viewYm();
    const payload = {};
    Object.keys(data).forEach(k => { if (k.startsWith(ym)) payload[k] = data[k]; });
    try {
      const r = await fetch(`${API}?ym=${encodeURIComponent(ym)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error('bad');
      loadedYm.add(ym);
    } catch(e){
      toast('⚠ 儲存失敗，請檢查網路');
    }
  }

  function mondayIndex(d){ return (d.getDay() + 6) % 7; }

  function emptyRoster(){
    return { s1: [], s2: [], s3: [], s4: [], s5: [], off: [] };
  }
  function hasRosterPeople(roster){
    if (!roster || typeof roster !== 'object') return false;
    return ['s1','s2','s3','s4','s5','off'].some(k => Array.isArray(roster[k]) && roster[k].length);
  }
  // 讀取某天：相容舊格式（字串 / {shift,note}）與含 roster 的單位班表
  function entryOf(k){
    const v = data[k];
    if (!v) return { shift: null, note: '', roster: null };
    if (typeof v === 'string') return { shift: v, note: '', roster: null };
    return {
      shift: v.shift || null,
      note: v.note || '',
      roster: v.roster && typeof v.roster === 'object' ? v.roster : null
    };
  }
  // 寫入某天：班別／記事／名單皆空則刪除；編輯時預設保留原 roster
  function writeEntry(k, shift, note, roster){
    const prev = entryOf(k);
    const s = shift || null;
    const n = (note || '').trim();
    const r = roster !== undefined ? roster : prev.roster;
    if (!s && !n && !hasRosterPeople(r)) { delete data[k]; return; }
    const obj = { shift: s, note: n };
    if (hasRosterPeople(r)) obj.roster = r;
    data[k] = obj;
  }

  function render(){
    const y = view.getFullYear(), m = view.getMonth();
    document.getElementById('monthLabel').textContent = `${y}年${m+1}月`;

    const first = new Date(y, m, 1);
    const startOffset = mondayIndex(first);
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();

    const cells = [];
    const total = startOffset + daysInMonth;
    const nextPad = (7 - (total % 7)) % 7;

    for (let i = startOffset - 1; i >= 0; i--) cells.push({ d: prevDays - i, out: true });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ d, out: false, m, y });
    for (let d = 1; d <= nextPad; d++) cells.push({ d, out: true });

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const tKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());

    cells.forEach(c => {
      const div = document.createElement('div');
      div.className = 'cell' + (c.out ? ' out' : '');
      if (!c.out){
        const k = keyOf(c.y, c.m, c.d);
        if (k === tKey) div.classList.add('today');
        if (k === selectedKey) div.classList.add('selected');
        const num = document.createElement('div');
        num.className = 'num'; num.textContent = c.d;
        div.appendChild(num);
        const e = entryOf(k);
        // 班別區：永遠建立，沒班別就留空（預留空間讓對齊一致）
        const s = document.createElement('div');
        s.className = 'shift' + (e.shift && SHIFT_TYPES[e.shift] ? ' ' + SHIFT_TYPES[e.shift].cls : ' empty');
        if (e.shift && SHIFT_TYPES[e.shift]) s.textContent = SHIFT_TYPES[e.shift].label;
        div.appendChild(s);
        // 記事區：永遠建立，沒記事就留空
        const nt = document.createElement('div');
        nt.className = 'note' + (e.note ? '' : ' empty');
        if (e.note) nt.textContent = e.note;
        div.appendChild(nt);

  function toHalfWidth(s) {
    return String(s || '').replace(/[\uFF01-\uFF5E]/g, ch =>
      String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)
    ).replace(/\u3000/g, ' ');
  }

  function normText(s) {
    return toHalfWidth(s).replace(/[\s\u00a0\u200b\uFEFF]/g, '').trim();
  }

  function ymResult(y, mo) {
    if (!(mo >= 1 && mo <= 12) || !(y >= 1990 && y <= 2100)) return null;
    return { y, m: mo - 1, ym: `${y}-${pad(mo)}` };
  }

  function parseYmFromText(text) {
    const t = toHalfWidth(text || '');
    // 民國：115年11月 / 民國115年11月份（(?:民國)? 整段可省略）
    let m = t.match(/(?:民國)?\s*(\d{2,3})\s*年\s*(\d{1,2})\s*月份?/);
    if (m) return ymResult(parseInt(m[1], 10) + 1911, parseInt(m[2], 10));
    // 西元：2026年11月
    m = t.match(/(20\d{2})\s*年\s*(\d{1,2})\s*月份?/);
    if (m) return ymResult(parseInt(m[1], 10), parseInt(m[2], 10));
    // 115/11、115-11
    m = t.match(/(?:民國)?\s*(\d{2,3})\s*[\/.\-]\s*(\d{1,2})(?!\d)/);
    if (m) {
      let y = parseInt(m[1], 10);
      const mo = parseInt(m[2], 10);
      if (y >= 50 && y <= 200) y += 1911;
      return ymResult(y, mo);
    }
    m = t.match(/(20\d{2})\s*[\/.\-]\s*(\d{1,2})(?!\d)/);
    if (m) return ymResult(parseInt(m[1], 10), parseInt(m[2], 10));
    // 手動／檔名：2026-11 或 115-11
    m = t.match(/\b(20\d{2})-(\d{1,2})\b/);
    if (m) return ymResult(parseInt(m[1], 10), parseInt(m[2], 10));
    m = t.match(/\b(\d{2,3})-(\d{1,2})\b/);
    if (m) {
      let y = parseInt(m[1], 10);
      if (y >= 50 && y <= 200) y += 1911;
      return ymResult(y, parseInt(m[2], 10));
    }
    return null;
  }

  function parseRosterYearMonth(html, fileName, manualYm) {
    // 1) 使用者手動填的年月最優先
    if (manualYm && String(manualYm).trim()) {
      const hit = parseYmFromText(String(manualYm).trim());
      if (hit) return hit;
    }
    // 2) 去掉 HTML 標籤後的純文字（Excel 常把「115」「年」「11」「月」拆開）
    const stripped = toHalfWidth(String(html || '').replace(/<[^>]+>/g, ' '));
    let hit = parseYmFromText(stripped);
    if (hit) return hit;
    // 3) DOM 可見文字
    try {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const visible = (doc.body && (doc.body.innerText || doc.body.textContent)) || '';
      hit = parseYmFromText(visible);
      if (hit) return hit;
    } catch (_) {}
    // 4) 檔名
    if (fileName) {
      hit = parseYmFromText(fileName);
      if (hit) return hit;
      // 檔名含 十一月 / 11月
      const fn = toHalfWidth(fileName);
      const m = fn.match(/(20\d{2}|1[0-2]\d).*?(1[0-2]|[1-9])\s*月/) ||
        fn.match(/([一二三四五六七八九十]+)\s*月/);
      // 檔名 202611 / 11511AS.HTML
      const compact = fn.match(/(20\d{2})(1[0-2]|0[1-9])/);
      if (compact) return ymResult(parseInt(compact[1], 10), parseInt(compact[2], 10));
      const roc = fn.match(/(1[0-2]\d)(1[0-2]|0[1-9])/);
      if (roc) return ymResult(parseInt(roc[1], 10) + 1911, parseInt(roc[2], 10));
    }
    return null;
  }

  function cellText(td) {
    return normText(td && td.textContent);
  }

  function isShiftCode(v) {
    return v === '' || v === '/' || v === '—' || v === '-' ||
      /^[1-5]$/.test(v) || v === 'H' || v === 'h';
  }

  function rowCells(tr) {
    let tds = Array.from(tr.children).filter(el =>
      el.tagName === 'TD' || el.tagName === 'TH'
    );
    if (tds.length < 2) tds = Array.from(tr.querySelectorAll('td,th'));
    return tds;
  }

  function tableRows(table) {
    return Array.from(table.querySelectorAll('tr'));
  }

  function collectDayCodes(tds, start) {
    const days = [];
    for (let d = 0; d < 31 && start + d < tds.length; d++) {
      let v = cellText(tds[start + d]);
      if (/^\d{2,}$/.test(v) && !/^[1-5]$/.test(v)) break;
      if (!isShiftCode(v) && v.length > 2) break;
      if (v === '' || v === '—' || v === '-') v = '/';
      days.push(v);
    }
    return days;
  }

  function scoreDayRow(days) {
    if (!days || days.length < 20) return -1;
    let good = 0, eight = 0;
    for (const v of days) {
      if (/^[1-5]$/.test(v) || v === 'H' || v === 'h' || v === '/') good++;
      if (v === '8') eight++;
    }
    // OpWeb「平時」為 1–5；「日班」常出現 8（工時），降低分數
    return good * 3 - eight * 2 + Math.min(days.length, 31);
  }

  /** OpWeb：並排姓名表 + 班別表 → 全單位 [{name, days}] */
  function extractAllFromSplitTables(all) {
    let best = null;
    for (let ti = 0; ti < all.length; ti++) {
      const nameTable = all[ti];
      if (nameTable.querySelector('table')) continue;
      const nRows = tableRows(nameTable);
      const namesByRi = {};
      nRows.forEach((tr, ri) => {
        const tds = rowCells(tr);
        if (tds.length < 1 || tds.length > 4) return;
        let c0 = cellText(tds[0]).replace(/　+$/, '');
        if (c0.length < 2 || c0.length > 4) return;
        if (/^[0-9]+$/.test(c0)) return;
        if (c0 === '姓名' || c0 === '員工' || c0 === '編號') return;
        namesByRi[ri] = c0;
      });
      const nameCount = Object.keys(namesByRi).length;
      if (nameCount < 3) continue;

      for (let tj = ti + 1; tj < Math.min(all.length, ti + 6); tj++) {
        const sched = all[tj];
        if (sched.querySelector('table')) continue;
        const sRows = tableRows(sched);
        if (Math.abs(sRows.length - nRows.length) > 2) continue;
        const people = [];
        Object.keys(namesByRi).forEach(riStr => {
          const ri = parseInt(riStr, 10);
          if (ri >= sRows.length) return;
          const tds = rowCells(sRows[ri]);
          if (tds.length < 20) return;
          const days = collectDayCodes(tds, 0);
          if (scoreDayRow(days) < 0) return;
          people.push({ name: namesByRi[ri], days: days.slice(0, 31) });
        });
        if (people.length < 3) continue;
        let bonus = 0;
        for (let k = Math.max(0, ti - 8); k <= ti; k++) {
          if (normText(all[k].textContent || '').includes('平時')) bonus += 100;
        }
        const avgSc = people.reduce((s, p) => s + scoreDayRow(p.days), 0) / people.length;
        const score = people.length * 10 + bonus + avgSc + (tj - ti === 1 ? 10 : 0);
        if (!best || score > best.score) best = { people, score };
      }
    }
    return best ? best.people : null;
  }

  /** OpWeb：姓名表與班別表分開並排；只認「無巢狀 table」的姓名列（單人） */
  function extractFromSplitTables(all, name) {
    const allPeople = extractAllFromSplitTables(all);
    if (!allPeople) return null;
    const hit = allPeople.find(p => p.name === name || p.name === name + '　');
    return hit ? hit.days : null;
  }

  /**
   * OpWeb 原始 HTML 字串解析（不依賴瀏覽器 DOM 重排）
   * 只取「平時」段：名單順序 ↔ 班別列順序 → 全單位。
   */
  function extractOpWebAllPeople(html) {
    const src = String(html || '');
    const iPing = src.indexOf('平時');
    if (iPing < 0) return null;
    const section = src.slice(iPing);

    const nameRe = /<font[^>]*>([^<]{2,6})\s*<\/font>\s*<\/td>\s*<td[^>]*>\s*<font[^>]*>(\d{3,})\s*<\/font>/gi;
    const names = [];
    let m;
    while ((m = nameRe.exec(section)) !== null) {
      const n = normText(m[1]);
      if (n === '姓名' || n === '員工' || n === '編號') continue;
      if (/^[0-9]+$/.test(n)) continue;
      if (n.length < 2 || n.length > 4) continue;
      names.push({ name: n, emp: m[2] });
    }
    if (!names.length) return null;
    const groupSize = names.length;

    const trRe = /<tr[\s\S]*?<\/tr>/gi;
    const schedules = [];
    let tr;
    while ((tr = trRe.exec(section)) !== null) {
      const rowHtml = tr[0];
      if (/<font[^>]*>\s*\d{3,}\s*<\/font>/.test(rowHtml) &&
          /<font[^>]*>\s*[\u4e00-\u9fff]{2,4}\s*<\/font>/.test(rowHtml)) {
        continue;
      }
      const codes = [];
      const re = /<font[^>]*>([\s\S]*?)<\/font>/gi;
      let cm;
      while ((cm = re.exec(rowHtml)) !== null) {
        let v = normText(cm[1].replace(/&nbsp;/gi, ''));
        if (v === '') v = '/';
        if (v === '8' || isShiftCode(v)) codes.push((v === '—' || v === '-') ? '/' : v);
        else if (codes.length >= 20) break;
        else if (codes.length && v.length > 1) break;
      }
      if (codes.length >= 20) schedules.push(codes.slice(0, 31));
    }
    if (schedules.length < groupSize) return null;

    // 平時段內班別列數 = 人數；若較多則取最後一組
    const base = schedules.length - groupSize;
    const people = [];
    for (let i = 0; i < groupSize; i++) {
      const days = schedules[base + i];
      if (!days || scoreDayRow(days) < 0) continue;
      people.push({ name: names[i].name, days });
    }
    return people.length ? people : null;
  }

  function extractOpWebByRegex(html, name) {
    const people = extractOpWebAllPeople(html);
    if (!people) return null;
    const hit = people.find(p => p.name === name);
    return hit ? hit.days : null;
  }

  /** 從輪值表 HTML 擷取「平時」全單位名單與各日代碼 */
  function extractFullRoster(html) {
    const byRegex = extractOpWebAllPeople(html);
    if (byRegex && byRegex.length) return byRegex;

    const doc = new DOMParser().parseFromString(html, 'text/html');
    const all = Array.from(doc.querySelectorAll('table'));
    if (!all.length) throw new Error('HTML 內沒有表格');

    const split = extractAllFromSplitTables(all);
    if (split && split.length) return split;

    // 傳統：同一列含姓名與各日代碼 → 掃全部列
    const ranked = [];
    all.forEach((table, idx) => {
      let score = idx;
      let label = '';
      let el = table.previousElementSibling;
      for (let k = 0; k < 6 && el; k++, el = el.previousElementSibling) {
        label += normText(el.textContent || '');
      }
      const parentLabel = normText((table.parentElement && table.parentElement.textContent) || '').slice(0, 120);
      const near = label + parentLabel;
      if (near.includes('平時') || normText(table.textContent || '').slice(0, 40).includes('平時')) score += 1000;
      if (near.includes('日班') && !near.includes('平時')) score -= 300;
      if (tableRows(table).length >= 5) score += 50;
      ranked.push({ table, score });
    });
    ranked.sort((a, b) => b.score - a.score);

    for (const { table } of ranked) {
      const people = [];
      for (const tr of tableRows(table)) {
        const tds = rowCells(tr);
        if (tds.length < 5) continue;
        let nameIdx = -1;
        let person = '';
        for (let i = 0; i < Math.min(tds.length, 8); i++) {
          const ct = cellText(tds[i]);
          if (ct.length >= 2 && ct.length <= 4 && !/^[0-9]+$/.test(ct) &&
              ct !== '姓名' && ct !== '員工' && ct !== '編號') {
            nameIdx = i; person = ct; break;
          }
        }
        if (nameIdx < 0) continue;
        let start = nameIdx + 1;
        const maybeId = cellText(tds[start]);
        if (/^\d{3,}$/.test(maybeId) && !/^[1-5]$/.test(maybeId)) start += 1;
        const days = collectDayCodes(tds, start);
        if (scoreDayRow(days) >= 0) people.push({ name: person, days: days.slice(0, 31) });
      }
      if (people.length >= 3) return people;
    }
    throw new Error('無法解析單位平時班表（需含姓名與班別列）');
  }

  /** 從輪值表 HTML 擷取「平時」表中指定姓名的 1–31 日代碼 */
  function extractPersonDays(html, personName) {
    const name = normText(personName);
    if (!name) throw new Error('請填姓名');

    const byRegex = extractOpWebByRegex(html, name);
    if (byRegex) return byRegex;

    const doc = new DOMParser().parseFromString(html, 'text/html');
    const all = Array.from(doc.querySelectorAll('table'));
    if (!all.length) throw new Error('HTML 內沒有表格');

    const split = extractFromSplitTables(all, name);
    if (split) return split;

    try {
      const full = extractFullRoster(html);
      const hit = full.find(p => p.name === name);
      if (hit) return hit.days;
    } catch (_) {}

    throw new Error('找不到「' + name + '」的平時班列（請確認為 Big5 輪值表）');
  }

  function readRosterFile(file) {
    const looksOk = (t) => {
      if (!t || t.includes('\ufffd')) return false;
      const h = toHalfWidth(t);
      return /平時|日班|輪值|中華民國|曾威龍/.test(h) ||
        (t.match(/[\u4e00-\u9fff]/g) || []).length >= 20;
    };
    return file.arrayBuffer().then((buf) => {
      // OpWeb 固定 Big5；優先 TextDecoder，勿先用 UTF-8 誤判
      for (const enc of ['big5', 'utf-8']) {
        try {
          const t = new TextDecoder(enc, { fatal: false }).decode(buf);
          if (looksOk(t)) return t;
        } catch (_) {}
      }
      return new Promise((resolve, reject) => {
        const rd = new FileReader();
        rd.onload = () => resolve(String(rd.result || ''));
        rd.onerror = () => reject(rd.error || new Error('讀檔失敗'));
        try { rd.readAsText(file, 'big5'); }
        catch (_) { rd.readAsText(file); }
      });
    });
  }

  function codeToShiftKey(raw) {
    const v = String(raw == null ? '/' : raw).trim();
    if (v === '1') return 's1';
    if (v === '2') return 's2';
    if (v === '3') return 's3';
    if (v === '4') return 's4';
    if (v === '5') return 's5';
    if (v === 'H') return 's1'; // 假日值班 H → 一班
    if (v === 'h') return 's2'; // 假日值班 h → 二班
    if (v === '/' || v === '' || v === '—' || v === '-') return 'off';
    return null;
  }

  function daysToMonthPayload(ym, days, prevMonthData) {
    const payload = {};
    const daysInMonth = new Date(
      parseInt(ym.slice(0, 4), 10),
      parseInt(ym.slice(5, 7), 10),
      0
    ).getDate();
    for (let i = 1; i <= Math.min(days.length, daysInMonth); i++) {
      const k = `${ym}-${pad(i)}`;
      const sk = codeToShiftKey(days[i - 1]);
      const old = prevMonthData[k];
      const oldNote = old && typeof old === 'object' ? (old.note || '').trim() : '';
      const oldRoster = old && typeof old === 'object' ? old.roster : null;
      if (sk && sk !== 'off') {
        const obj = { shift: sk, note: oldNote };
        if (hasRosterPeople(oldRoster)) obj.roster = oldRoster;
        payload[k] = obj;
      } else if (sk === 'off') {
        const obj = { shift: 'off', note: oldNote };
        if (hasRosterPeople(oldRoster)) obj.roster = oldRoster;
        payload[k] = obj;
      } else if (oldNote || hasRosterPeople(oldRoster)) {
        const obj = { shift: null, note: oldNote };
        if (hasRosterPeople(oldRoster)) obj.roster = oldRoster;
        payload[k] = obj;
      }
    }
    return payload;
  }

  /** 全單位班列 → 每日 { shift(焦點), note, roster:{s1..off} } */
  function peopleToMonthPayload(ym, people, focusName, prevMonthData) {
    const focus = normText(focusName);
    const daysInMonth = new Date(
      parseInt(ym.slice(0, 4), 10),
      parseInt(ym.slice(5, 7), 10),
      0
    ).getDate();
    const payload = {};
    for (let i = 1; i <= daysInMonth; i++) {
      const k = `${ym}-${pad(i)}`;
      const roster = emptyRoster();
      let focusShift = null;
      for (const p of people) {
        if (!p.days || p.days[i - 1] === undefined) continue;
        const sk = codeToShiftKey(p.days[i - 1]);
        if (!sk) continue;
        roster[sk].push(p.name);
        if (normText(p.name) === focus) focusShift = sk;
      }
      const old = prevMonthData[k];
      const oldNote = old && typeof old === 'object' ? (old.note || '').trim() : '';
      if (!hasRosterPeople(roster) && !oldNote) continue;
      payload[k] = { shift: focusShift, note: oldNote, roster };
    }
    return payload;
  }

  document.getElementById('rosterInput').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    e.target.value = '';
    (async () => {
      try {
        const html = await readRosterFile(f);
        const person = importNameEl.value.trim() || '曾威龍';
        const manualYm = (document.getElementById('importYm') || {}).value || '';
        localStorage.setItem('shiftImportName', person);
        const ymInfo = parseRosterYearMonth(html, f.name || '', manualYm);
        if (!ymInfo) {
          toast('無法辨識年月：請在匯入視窗填「2026-11」或「115-11」後再選檔');
          return;
        }
        const people = extractFullRoster(html);
        const focusHit = people.find(p => normText(p.name) === normText(person));
        if (!focusHit) {
          throw new Error('名單中找不到「' + person + '」（已讀到 ' + people.length + ' 人）');
        }
        // 先載入該月既有資料以保留記事
        await loadMonth(ymInfo.ym);
        const prev = {};
        Object.keys(data).forEach(k => { if (k.startsWith(ymInfo.ym)) prev[k] = data[k]; });
        const payload = peopleToMonthPayload(ymInfo.ym, people, person, prev);
        if (!Object.keys(payload).length) {
          throw new Error('有讀到班列但沒有可寫入的班別（1–5 / H / h）');
        }
        Object.keys(data).forEach(k => { if (k.startsWith(ymInfo.ym)) delete data[k]; });
        Object.assign(data, payload);
        loadedYm.add(ymInfo.ym);
        const r = await fetch(`${API}?ym=${encodeURIComponent(ymInfo.ym)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!r.ok) throw new Error('儲存失敗（API ' + r.status + '）');
        view = new Date(ymInfo.y, ymInfo.m, 1);
        importOverlay.classList.remove('show');
        render();
        toast(`已匯入全單位 ${people.length} 人 · ${ymInfo.ym}（標示 ${person}）`);
      } catch (err) {
        toast('⚠ ' + (err.message || '匯入失敗'));
      }
    })();
  };

  document.getElementById('fileInput').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const imported = JSON.parse(rd.result);
        const byYm = {};
        Object.keys(imported).forEach(k => {
          if (typeof k !== 'string' || k.length < 7) return;
          const ym = k.slice(0, 7);
          (byYm[ym] || (byYm[ym] = {}))[k] = imported[k];
        });
        for (const ym of Object.keys(byYm)) {
          Object.keys(data).forEach(k => { if (k.startsWith(ym)) delete data[k]; });
          Object.assign(data, byYm[ym]);
          loadedYm.add(ym);
          await fetch(`${API}?ym=${encodeURIComponent(ym)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(byYm[ym])
          });
        }
        await ensureViewMonth();
        render();
        toast('匯入成功（已分月儲存）');
      } catch(err){ toast('JSON 解析失敗'); }
    };
    rd.readAsText(f);
  };

  function tick(){
    const n = new Date();
    document.getElementById('clock').textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  }
  tick(); setInterval(tick, 10000);

  // 初始化：只載入目前月份
  selectedKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());
  ensureViewMonth().then(render);
})();
</script>
